name: springy

services:
  web:
    image: springy:local
    build:
      context: .
      target: runtime
    ports:
      - "${SPRINGY_BIND_ADDRESS:-127.0.0.1}:${SPRINGY_PORT:-8080}:8080"
    restart: unless-stopped
    init: true
    read_only: true
    user: "101:101"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    pids_limit: 128
    mem_limit: 128m
    cpus: 1.0
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
