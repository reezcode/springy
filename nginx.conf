worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    autoindex off;
    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map_hash_bucket_size 256;
    map_hash_max_size 2048;

    # Generated from the exact inline scripts in each exported HTML page.
    include /etc/nginx/csp.conf;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        absolute_redirect off;

        add_header Content-Security-Policy "default-src 'self'; script-src $springy_script_sources; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        # This deployment is a static site; it has no upload or write endpoints.
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
        location ~ /\. {
            return 404;
        }
        location / {
            try_files $uri $uri/ =404;
        }
        error_page 404 /404.html;
        location = /404.html {
            internal;
        }
    }
}
